<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#3fb950" stroke-opacity=".07"/>
  </pattern>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
    <stop offset=".5" stop-color="#3fb950"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
  @keyframes glide{from{transform:translateX(-300px)}to{transform:translateX(900px)}}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<rect width="900" height="90" fill="#0d1117"/>
<rect width="900" height="90" fill="url(#grid)"/>
<rect y="0" width="900" height="1" fill="#30363d"/>
<rect y="-1" width="300" height="3" fill="url(#g)" style="animation:glide 5s cubic-bezier(.45,0,.55,1) infinite"/>
<text x="450" y="52" text-anchor="middle" class="mono" font-size="14" fill="#8b949e" style="animation:breathe 4s ease-in-out infinite">build useful  ·  understand how it works  ·  keep learning</text>
</svg>
