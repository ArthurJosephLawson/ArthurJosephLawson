<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 8" width="900" height="8" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
    <stop offset=".5" stop-color="#3fb950"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  @keyframes glide{from{transform:translateX(-260px)}to{transform:translateX(900px)}}
  .s{animation:glide 6s cubic-bezier(.45,0,.55,1) infinite}
</style>
<rect y="3.5" width="900" height="1" fill="#30363d"/>
<rect class="s" y="2.5" width="260" height="3" rx="1.5" fill="url(#g)"/>
</svg>
