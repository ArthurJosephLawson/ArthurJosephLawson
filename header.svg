<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#3fb950" stroke-opacity=".07"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#3fb950" stop-opacity=".22"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sweep" x1="0" x2="1">
    <stop offset="0" stop-color="#3fb950" stop-opacity="0"/>
    <stop offset=".5" stop-color="#3fb950"/>
    <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .in{opacity:0;animation:in 1s cubic-bezier(.2,.7,.2,1) forwards}
  .tile{opacity:0;animation:inx 1s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes inx{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
  @keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(-160px,60px)}}
  @keyframes role{
    0%{opacity:0;transform:translateY(8px)}
    5%{opacity:1;transform:translateY(0)}
    22%{opacity:1;transform:translateY(0)}
    27%{opacity:0;transform:translateY(-8px)}
    100%{opacity:0;transform:translateY(-8px)}
  }
  @keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3.2);opacity:0}}
  @keyframes glide{from{transform:translateX(-300px)}to{transform:translateX(900px)}}
  .role{opacity:0;animation:role 12s cubic-bezier(.4,0,.2,1) infinite}
  .ring{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
</style>

<rect width="900" height="260" fill="#0d1117"/>
<rect width="900" height="260" fill="url(#grid)"/>
<circle cx="760" cy="90" r="200" fill="url(#glow)" style="animation:drift 10s ease-in-out infinite alternate"/>

<!-- label -->
<g class="in" style="animation-delay:.1s">
  <circle class="ring" cx="64" cy="42" r="4" fill="#3fb950"/>
  <circle cx="64" cy="42" r="4" fill="#3fb950"/>
  <text x="80" y="46" class="mono" font-size="13" fill="#8b949e">~/arthur · scriptmonks</text>
</g>

<!-- name -->
<text x="60" y="94" class="mono in" font-size="16" fill="#8b949e" style="animation-delay:.25s">hey, I'm</text>
<text x="58" y="154" class="sans in" font-size="70" font-weight="700" fill="#e6edf3" letter-spacing="-1.5" style="animation-delay:.4s">Arthur</text>

<!-- accent line -->
<line x1="60" y1="174" x2="180" y2="174" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-dasharray="120" stroke-dashoffset="120" style="animation:draw 1s cubic-bezier(.4,0,.2,1) .9s forwards"/>

<!-- rotating roles -->
<g class="mono" font-size="20" fill="#3fb950">
  <text x="60" y="212" class="role" style="animation-delay:1.2s">Builder · Freelancer</text>
  <text x="60" y="212" class="role" style="animation-delay:4.2s">Founder of Scriptmonks</text>
  <text x="60" y="212" class="role" style="animation-delay:7.2s">Cybersecurity enthusiast</text>
  <text x="60" y="212" class="role" style="animation-delay:10.2s">Arch user · Agentic engineering</text>
</g>

<!-- info tiles -->
<g class="tile" style="animation-delay:0.7s">
  <rect x="600" y="32" width="250" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="600" y="32" width="3" height="62" rx="1.5" fill="#3fb950"/>
  <text x="620" y="56" class="mono" font-size="11" fill="#8b949e" letter-spacing="1.5">BUILT</text>
  <text x="620" y="78" class="mono" font-size="12" fill="#e6edf3">Deploymonk · CLI scaffolder</text>
</g>
<g class="tile" style="animation-delay:0.9s">
  <rect x="600" y="102" width="250" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="600" y="102" width="3" height="62" rx="1.5" fill="#3fb950"/>
  <text x="620" y="126" class="mono" font-size="11" fill="#8b949e" letter-spacing="1.5">PRIVATE TOOL</text>
  <text x="620" y="148" class="mono" font-size="12" fill="#e6edf3">Personal command center</text>
</g>
<g class="tile" style="animation-delay:1.1s">
  <rect x="600" y="172" width="250" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
  <rect x="600" y="172" width="3" height="62" rx="1.5" fill="#3fb950"/>
  <text x="620" y="196" class="mono" font-size="11" fill="#8b949e" letter-spacing="1.5">RUNS ON</text>
  <text x="620" y="218" class="mono" font-size="12" fill="#e6edf3">Arch Linux · daily driver</text>
</g>

<!-- bottom hairline with glide -->
<rect y="258" width="900" height="1" fill="#30363d"/>
<rect y="257" width="300" height="3" fill="url(#sweep)" style="animation:glide 5s cubic-bezier(.45,0,.55,1) infinite"/>
</svg>
